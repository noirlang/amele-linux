name: Linux Agent CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Linux agent
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check Python syntax
        run: python -m py_compile linux.py

      - name: Build binary
        run: pyinstaller --noconfirm --onefile --name amele-linux --distpath dist --workpath build --specpath build linux.py

      - name: Verify binary exists
        run: test -x dist/amele-linux

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: amele-linux-x64
          path: dist/amele-linux
          if-no-files-found: error
